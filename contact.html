<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Get in touch with iQamata LiKhaya NPO leadership team in Cofimvaba, Eastern Cape."/>
  <title>Contact Us | iQamata LiKhaya NPO</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#F5F2EB] text-[#2C3531] font-sans antialiased selection:bg-[#4A5D4E] selection:text-white">

  <!-- Header / Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-[#F5F2EB]/95 backdrop-blur-md border-b border-[#D8D2C2] transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <!-- Logo Header -->
        <a href="index.html#home" class="flex items-center space-x-3 group">
          <img src="logo.jpg" alt="iQamata LiKhaya Logo" class="w-10 h-10 object-cover rounded-full shadow-sm transition-transform group-hover:scale-105" />
          <div class="flex flex-col">
            <span class="font-serif text-xl font-bold tracking-tight text-[#2C3531]">iQamata LiKhaya</span>
            <span class="text-[10px] tracking-widest uppercase text-[#8C7A6B] font-semibold">Non-Profit Organisation</span>
          </div>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="index.html#about" class="hover:text-[#4A5D4E] transition-colors">About Us</a>
          <a href="index.html#pillars" class="hover:text-[#4A5D4E] transition-colors">Core Pillars</a>
          <a href="index.html#impact" class="hover:text-[#4A5D4E] transition-colors">Impact</a>
          <a href="enquiry.html" class="hover:text-[#4A5D4E] transition-colors">Enquiry</a>
          <a href="contact.html" class="text-[#4A5D4E] font-bold underline">Contact Us</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Contact Section -->
  <section class="pt-32 pb-20 md:pt-40 md:pb-28 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 bg-white/80 p-8 sm:p-12 rounded-3xl border border-[#D8D2C2] shadow-lg">
      
      <!-- Left Column: Contact Info -->
      <div class="lg:col-span-5 space-y-6">
        <span class="text-xs font-bold uppercase tracking-widest text-[#8C7A6B] bg-[#E2DACB] px-3.5 py-1.5 rounded-full">Get In Touch</span>
        <h1 class="font-serif text-3xl font-normal text-[#2C3531]">Contact Our Team</h1>
        <p class="text-xs text-[#555] leading-relaxed">
          Have a question about our operations, community projects, or leadership? Send us a direct message below.
        </p>

        <div class="space-y-4 pt-4 text-xs text-[#444]">
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-[#E2DACB] flex items-center justify-center text-[#4A5D4E] shrink-0 mt-0.5">
              <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
              <strong class="block text-[#2C3531]">Location</strong>
              <a href="https://www.google.com/maps/search/?api=1&query=Qamata+Nogate+Township,+Cofimvaba,+Eastern+Cape" target="_blank" class="hover:text-[#4A5D4E] underline">
                Qamata Nogate Township, Cofimvaba, Eastern Cape
              </a>
            </div>
          </div>
