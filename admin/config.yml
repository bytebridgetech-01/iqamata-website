backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Community Events & Gallery"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Event Description", name: "body", widget: "markdown" }
      - { label: "Event Photo / Featured Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Video Link (Optional)", name: "video_url", widget: "string", required: false }
      